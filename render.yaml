# Render Blueprint - one web service (https://render.com/docs/blueprint-spec).
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository (or use the README button).
#
# Secrets are NOT in this file:
#   OPENAI_API_KEY  sync: false   -> Render asks for it when the Blueprint is created
#
# Free plan notes: the disk is ephemeral and the service sleeps after ~15 min without traffic. On every
# (re)start the bundled data snapshot is restored, then prices / news / a fresh prediction are refreshed
# in the background (no OpenAI calls at start-up - validation runs only when someone clicks it).
services:
  - type: web
    name: nifty-news-volatility-predictor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SEED_DATABASE
        value: deploy/nifty_nvp_seed.sqlite.gz
      - key: AUTO_REFRESH_ON_START
        value: "true"
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: OPENAI_API_KEY
        sync: false
      - key: NEWS_PROVIDERS
        value: google_news_rss,publisher_rss,newsapi,gnews,marketaux
      - key: DISPLAY_TIMEZONE
        value: Asia/Kolkata
      - key: SENTIMENT_ENGINE
        value: lexicon
      - key: QUARTER_CONVENTION
        value: indian_fy
