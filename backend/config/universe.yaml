# Stock universe reference data. Two parts:
#
#   companies          INSTRUMENT CATALOG (name, symbols, sector, aliases for news matching). Being in
#                      the catalog does NOT make a company part of the universe.
#   universe_versions  DATE-AWARE MEMBERSHIP + WEIGHTS. Each version has an effective_from date, a
#                      source and a status. For a date d the universe is the CONFIRMED version with the
#                      latest effective_from <= d (and effective_to empty or >= d). Historical periods
#                      therefore keep their own membership and weights; today's weights are never
#                      applied retrospectively.
#
# Versions are seeded into `universe_members` by `python -m backend.cli seed-universe` and are
# IMMUTABLE once stored (edit by adding a new version). The only change allowed afterwards is an
# explicit confirmation: `python -m backend.cli universe --confirm <version>`.
#
# WEIGHTS ARE REFERENCE DATA, NOT LIVE VALUES. NSE does not publish constituent weights through a
# free API; they drift daily with prices. The NIFTY score only uses them relative to each other.

index:
  name: NIFTY 50
  yahoo_symbol: "^NSEI"

universe_versions:
  - version: legacy-approx-2025-06-30
    status: confirmed          # the configuration the project has used since its start
    effective_from: "2020-01-01"
    effective_to: null
    source: >-
      Initial project configuration. Weights approximate as of 2025-06-30 and NOT verified against an
      NSE factsheet; membership as configured by the project owner.
    source_date: "2025-06-30"
    members:
      - {ticker: HDFCBANK, weight: 13.0}
      - {ticker: ICICIBANK, weight: 9.0}
      - {ticker: RELIANCE, weight: 8.6}
      - {ticker: INFY, weight: 4.9}
      - {ticker: BHARTIARTL, weight: 4.6}
      - {ticker: LT, weight: 3.8}
      - {ticker: ITC, weight: 3.4}
      - {ticker: SBIN, weight: 3.1}
      - {ticker: TCS, weight: 2.9}
      - {ticker: AXISBANK, weight: 2.9}

  - version: nse-factsheet-2026-09-30
    status: confirmed   # confirmed by the project owner on 2026-10-02 (membership change: -ITC -TCS +KOTAKBANK +M&M)
    effective_from: "2026-09-30"
    effective_to: null
    source: >-
      NSE Indices "NIFTY 50" factsheet (Indexogram) dated 2026-09-30, table "Top constituents by
      weightage" (https://www.niftyindices.com/Factsheet/ind_nifty50.pdf, downloaded 2026-10-02).
      Membership and weights read from that table.
    source_date: "2026-09-30"
    members:
      - {ticker: HDFCBANK, weight: 10.38}
      - {ticker: ICICIBANK, weight: 9.05}
      - {ticker: RELIANCE, weight: 7.58}
      - {ticker: BHARTIARTL, weight: 5.10}
      - {ticker: LT, weight: 4.20}
      - {ticker: SBIN, weight: 3.79}
      - {ticker: AXISBANK, weight: 3.37}
      - {ticker: INFY, weight: 3.35}
      - {ticker: KOTAKBANK, weight: 2.93}
      - {ticker: "M&M", weight: 2.52}

companies:
