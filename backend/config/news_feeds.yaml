# Official publisher RSS feeds used by the `publisher_rss` provider (no API key).
#
# These are syndication feeds published by the outlets themselves (no page scraping). Each item has
# a headline, link, description and an RFC-822 pubDate with an explicit +0530 offset, i.e. exact
# timestamps - unlike Google News RSS, whose older items are date-only.
# Feeds only list RECENT items (roughly the last day), so this provider cannot backfill history; its
# value is timestamp-accurate, verifiable pre-market news collected by the daily run.
#
# Checked 2026-10-02 from this machine: all feeds below returned current items. Excluded:
# moneycontrol.com/rss/* (stale - newest item April 2024) and thehindubusinessline.com feeds
# (connections dropped mid-transfer).

